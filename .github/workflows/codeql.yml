name: CodeQL Analysis
on:
  push:
    branches:
    - main
    - master
    - develop
    - test/update  
  workflow_dispatch:
jobs:
  codeql-analysis:
    uses: Kynetixx/codeql-module/.github/workflows/codeql-analysis.yml@main
  check-vulnerabilities:
    needs: codeql-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check Vulnerability Score
        id: get-score
        run: |
          echo "Final vulnerability score: ${{ needs.codeql-analysis.outputs.score }}"

      - name: Check Score and Block Pipeline
        if: needs.codeql-analysis.outputs.score < 75
        run: |
          echo "Vulnerability score is too low: ${{ needs.call-codeql-analysis.outputs.score }}. Blocking pipeline."
          exit 1  # This will cause the pipeline to fail

      - name: Proceed with Deployment
        if: needs.codeql-analysis.outputs.score >= 75
        run: |
          echo "Vulnerability score is acceptable: ${{ needs.call-codeql-analysis.outputs.score }}. Proceeding with deployment."
